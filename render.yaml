services:
  - type: web
    name: route53-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Route53 Clone API
      - key: API_V1_PREFIX
        value: /api
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: SEED_DEFAULT_USER
        value: "true"
      - key: ALLOW_ORIGINS
        value: https://YOUR_VERCEL_APP.vercel.app
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
